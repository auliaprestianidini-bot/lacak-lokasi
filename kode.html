
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Lokasi Pengguna</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #hasil { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Aplikasi Berbagi Lokasi</h2>
    <p>Klik tombol di bawah untuk membagikan lokasi Anda secara akurat.</p>
    
    <button onclick="dapatkanLokasi()">Bagikan Lokasi Saya</button>

    <div id="hasil"></div>

    <script>
        const elemenHasil = document.getElementById("hasil");

        function dapatkanLokasi() {
            // Mengecek apakah browser mendukung Geolocation
            if (navigator.geolocation) {
                elemenHasil.innerHTML = "Meminta izin lokasi...";
                navigator.geolocation.getCurrentPosition(tampilkanPosisi, tampilkanError, {
                    enableHighAccuracy: true // Meminta akurasi tertinggi (GPS)
                });
            } else {
                elemenHasil.innerHTML = "Geolocation tidak didukung oleh browser ini.";
            }
        }

        // Fungsi jika pengguna mengizinkan
        function tampilkanPosisi(posisi) {
            const latitude = posisi.coords.latitude;
            const longitude = posisi.coords.longitude;
            
            elemenHasil.innerHTML = `
                Lokasi berhasil didapatkan!<br>
                <strong>Latitude:</strong> ${latitude} <br>
                <strong>Longitude:</strong> ${longitude} <br>
                <br>
                <a href="https://www.google.com/maps?q=${latitude},${longitude}" target="_blank">Lihat di Google Maps</a>
            `;
        }

        // Fungsi jika pengguna menolak atau terjadi error
        function tampilkanError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    elemenHasil.innerHTML = "Pengguna menolak permintaan lokasi.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    elemenHasil.innerHTML = "Informasi lokasi tidak tersedia.";
                    break;
                case error.TIMEOUT:
                    elemenHasil.innerHTML = "Waktu permintaan lokasi habis.";
                    break;
                case error.UNKNOWN_ERROR:
                    elemenHasil.innerHTML = "Terjadi kesalahan yang tidak diketahui.";
                    break;
            }
        }
    </script>

</body>
</html>
